<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Suno Watcher Beta</title>
  <style>
    :root { --bg:#07060f; --cyan:#00f0ff; --magenta:#ff2bd6; --lime:#b6ff3c; --red:#ff3355; --text:#e7e9ff; --dim:#8a8eb0; --muted:#5a5d7a; --border:#1f1c3d; --grid:rgba(0,240,255,.06); }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:340px; }
    body { font-family:"Fira Code",Consolas,monospace; color:var(--text); background:radial-gradient(ellipse at top,#1a1240 0%,var(--bg) 70%); }
    header { display:flex; align-items:center; gap:10px; padding:12px 14px 10px; border-bottom:1px solid var(--border); background:linear-gradient(180deg,rgba(0,240,255,.05),transparent); }
    .title { font-size:12px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--cyan); text-shadow:0 0 8px rgba(0,240,255,.6); }
    .sub { font-size:10px; letter-spacing:1px; color:var(--magenta); margin-left:auto; text-shadow:0 0 6px rgba(255,43,214,.5); }
    main { padding:14px; }
    .note { font-size:10.5px; line-height:1.5; color:var(--dim); background:rgba(0,240,255,.05); padding:8px 10px; border-left:2px solid var(--cyan); margin-bottom:12px; }
    #counter { text-align:center; padding:10px; font-size:20px; font-weight:900; letter-spacing:2px; color:var(--cyan); text-shadow:0 0 14px rgba(0,240,255,.7); background:rgba(0,240,255,.06); border:1px solid rgba(0,240,255,.25); border-radius:4px; margin-bottom:12px; }
    #counter.empty { color:var(--muted); text-shadow:none; background:transparent; border-color:var(--border); font-size:13px; }
    .btn { width:100%; padding:12px 16px; cursor:pointer; border:1px solid var(--cyan); background:linear-gradient(135deg,rgba(0,240,255,.12),rgba(255,43,214,.12)); color:var(--cyan); font-family:inherit; font-weight:700; font-size:13px; letter-spacing:2px; text-transform:uppercase; border-radius:4px; text-shadow:0 0 8px rgba(0,240,255,.6); box-shadow:0 0 18px rgba(0,240,255,.2); transition:all .18s; margin-bottom:8px; }
    .btn:hover:not(:disabled) { color:var(--bg); background:linear-gradient(135deg,var(--cyan),var(--magenta)); text-shadow:none; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .btn.stop-btn { border-color:var(--red); color:var(--red); background:rgba(255,51,85,.1); display:none; }
    #tracks { margin-top:12px; display:none; flex-direction:column; gap:5px; max-height:300px; overflow-y:auto; }
    #tracks.visible { display:flex; }
    .track { display:flex; align-items:center; gap:8px; padding:6px 10px; background:rgba(13,10,26,.7); border:1px solid var(--border); border-left:3px solid var(--muted); border-radius:3px; font-size:10.5px; }
    .track[data-status="in_progress"] { border-left-color:var(--cyan); }
    .track[data-status="ok"] { border-left-color:var(--lime); background:linear-gradient(90deg,rgba(182,255,60,.1),rgba(13,10,26,.7) 60%); }
    .track[data-status="fail"] { border-left-color:var(--red); background:linear-gradient(90deg,rgba(255,51,85,.1),rgba(13,10,26,.7) 60%); }
    .track .mk { flex-shrink:0; font-size:10px; color:var(--muted); width:16px; text-align:center; }
    .track[data-status="ok"] .mk::before { content:"✓"; color:var(--lime); }
    .track[data-status="fail"] .mk::before { content:"✗"; color:var(--red); }
    .track[data-status="in_progress"] .mk::before { content:">"; color:var(--cyan); }
    .track[data-status="pending"] .mk::before { content:"·"; }
    .track .tn { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text); }
    #status { margin-top:10px; font-size:10px; max-height:110px; overflow-y:auto; padding:8px 10px; background:rgba(7,6,15,.7); border:1px solid var(--border); border-radius:3px; line-height:1.5; color:var(--dim); white-space:pre-wrap; }
    .footer { font-size:9px; letter-spacing:1.5px; color:var(--muted); text-align:center; padding:8px 0 10px; text-transform:uppercase; }
  </style>
</head>
<body>
  <header><span class="title">SUNO // WATCHER</span><span class="sub">BETA WAV</span></header>
  <main>
    <div class="note">Beta watcher. Keep Suno open, scroll selected rows once, then open this popup to download.</div>
    <div id="counter" class="empty">Nothing selected yet</div>
    <button class="btn" id="dlBtn">DOWNLOAD</button>
    <button class="btn stop-btn" id="stopBtn">STOP</button>
    <div id="tracks"></div>
    <div id="status"></div>
  </main>
  <div class="footer" id="ver">v0.4.0 beta</div>
  <script src="popup.js"></script>
</body>
</html>
